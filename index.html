<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #ffcdd2, #f8bdbd, #ff8a80);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 25%, rgba(255, 100, 150, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 85% 75%, rgba(200, 50, 150, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 40% 80%, rgba(255, 50, 100, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 70% 30%, rgba(255, 150, 200, 0.1) 0%, transparent 22%);
            z-index: -1;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 90%;
            position: relative;
            z-index: 10;
            animation: pulse 1.5s infinite alternate;
        }
        
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }
        
        .heart {
            font-size: 120px;
            color: #e91e63;
            margin: 20px 0;
            animation: heartbeat 1.2s ease-in-out infinite;
            text-shadow: 0 0 15px rgba(233, 30, 99, 0.7);
            position: relative;
            display: inline-block;
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }
        
        h1 {
            font-size: 42px;
            color: #d32f2f;
            margin: 25px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            position: relative;
            min-height: 60px;
        }
        
        button {
            padding: 15px 40px;
            font-size: 22px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 5;
        }
        
        #yesBtn {
            background: linear-gradient(to bottom, #ff6b6b, #e53935);
            color: white;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        #yesBtn:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 6px 15px rgba(229, 57, 53, 0.4);
            background: linear-gradient(to bottom, #ff5252, #c62828);
        }
        
        #yesBtn:active {
            transform: scale(0.98);
        }
        
        #noBtn {
            background: linear-gradient(to bottom, #bdbdbd, #757575);
            color: white;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        
        #noBtn:hover {
            transform: scale(1.05) translateX(-50%);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        
        #successMessage {
            display: none;
            margin-top: 30px;
            font-size: 32px;
            color: #c2185b;
            font-weight: bold;
            animation: fadeIn 1s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #f00;
            border-radius: 0;
            animation: confetti-fall 5s ease-in-out forwards;
        }
        
        @keyframes confetti-fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        
        .floating-heart {
            position: absolute;
            font-size: 20px;
            color: #e91e63;
            animation: float-up 6s ease-in-out infinite;
            z-index: 1;
        }
        
        @keyframes float-up {
            0% { transform: translateY(0) scale(0.8); opacity: 0.7; }
            50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-100px) scale(0.8); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">❤️</div>
        <h1>Will you be my Valentine?</h1>
        <div class="buttons">
            <button id="yesBtn">Yes </button>
            <button id="noBtn">No </button>
        </div>
        <div id="successMessage">Yay! I knew you would say yes! ❤️💕</div>
    </div>

    <script>
        // Create floating hearts in the background
        function createFloatingHearts() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.innerHTML = '❤️';
                    heart.style.left = `${Math.random() * 100}%`;
                    heart.style.top = `${Math.random() * 100}%`;
                    heart.style.fontSize = `${Math.random() * 20 + 10}px`;
                    heart.style.animationDuration = `${Math.random() * 3 + 4}s`;
                    heart.style.animationDelay = `${Math.random() * 2}s`;
                    document.body.appendChild(heart);
                    
                    // Remove after animation completes
                    setTimeout(() => {
                        heart.remove();
                    }, 6000);
                }, i * 300);
            }
        }
        
        // Create confetti celebration
        function createConfetti() {
            const colors = ['#ff4081', '#e91e63', '#f06292', '#ff80ab', '#f50057', '#c2185b'];
            const confettiCount = 150;
            
            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.top = `${Math.random() * 100}%`;
                confetti.style.width = `${Math.random() * 10 + 5}px`;
                confetti.style.height = `${Math.random() * 10 + 5}px`;
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                confetti.style.opacity = Math.random();
                confetti.style.animationDuration = `${Math.random() * 3 + 2}s`;
                confetti.style.animationDelay = `${Math.random() * 0.5}s`;
                document.body.appendChild(confetti);
                
                // Remove after animation
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
        
        // Move the "No" button to a random position
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const container = document.querySelector('.buttons');
            
            // Get container dimensions
            const containerRect = container.getBoundingClientRect();
            
            // Get button dimensions
            const btnRect = noBtn.getBoundingClientRect();
            const btnWidth = btnRect.width;
            const btnHeight = btnRect.height;
            
            // Calculate available space
            const maxX = containerRect.width - btnWidth;
            const maxY = containerRect.height - btnHeight;
            
            // Generate random position within container bounds
            const randomX = Math.max(0, Math.min(maxX, Math.random() * maxX));
            const randomY = Math.max(0, Math.min(maxY, Math.random() * maxY));
            
            // Set new position
            noBtn.style.top = `${randomY}px`;
            noBtn.style.left = `${randomX}px`;
            noBtn.style.transform = 'none';
            
            // Add a little bounce effect
            noBtn.style.animation = 'none';
            setTimeout(() => {
                noBtn.style.animation = 'pulse 0.5s ease';
            }, 10);
        }
        
        // Set up event listeners
        document.addEventListener('DOMContentLoaded', () => {
            createFloatingHearts();
            
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const successMessage = document.getElementById('successMessage');
            
            // Yes button click handler
            yesBtn.addEventListener('click', () => {
                // Hide buttons
                document.querySelector('.buttons').style.display = 'none';
                
                // Show success message
                successMessage.style.display = 'block';
                
                // Create celebration effects
                createConfetti();
                
                // Change heart color
                document.querySelector('.heart').style.color = '#ff4081';
                document.querySelector('.heart').style.animation = 'heartbeat 0.8s ease-in-out infinite';
                
                // Add romantic message
                setTimeout(() => {
                    const h1 = document.querySelector('h1');
                    h1.textContent = "You've made me the happiest person!";
                    h1.style.color = '#ff4081';
                    h1.style.fontSize = '36px';
                }, 1000);
            });
            
            // No button event listeners
            noBtn.addEventListener('mouseover', moveNoButton);
            noBtn.addEventListener('click', (e) => {
                e.preventDefault();
                moveNoButton();
                
                // Add a playful message after several attempts
                if (!noBtn.dataset.clickCount) {
                    noBtn.dataset.clickCount = 0;
                }
                noBtn.dataset.clickCount = parseInt(noBtn.dataset.clickCount) + 1;
                
                if (parseInt(noBtn.dataset.clickCount) > 3) {
                    document.querySelector('h1').textContent = "Aww, don't be like that! Please be my Valentine?";
                }
                
                if (parseInt(noBtn.dataset.clickCount) > 6) {
                    document.querySelector('h1').textContent = "I'm not giving up! You have to say yes! ";
                }
                
                if (parseInt(noBtn.dataset.clickCount) > 10) {
                    // Make the no button smaller
                    noBtn.style.transform = 'scale(0.8)';
                    document.querySelector('h1').textContent = "Okay, okay... I'll make it easier for you! ";
                }
            });
            
            // Initial position setup for no button
            setTimeout(() => {
                const container = document.querySelector('.buttons');
                const noBtn = document.getElementById('noBtn');
                const containerRect = container.getBoundingClientRect();
                const btnRect = noBtn.getBoundingClientRect();
                
                // Center the no button initially
                noBtn.style.top = `${(containerRect.height - btnRect.height) / 2}px`;
                noBtn.style.left = `${(containerRect.width - btnRect.width) / 2}px`;
                noBtn.style.transform = 'none';
            }, 100);
        });
    </script>
</body>

</html>
